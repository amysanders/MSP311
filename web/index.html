<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minneapolis 311: How fast does the city respond?</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
  <header>
    <h1>How quickly does Minneapolis resolve 311 requests?</h1>
    <p class="subtitle" id="subtitle">
      <!-- Filled in by app.js from data/processed/overall.json -->
    </p>
  </header>

  <section id="overall-stats">
    <!-- Filled in by app.js from data/processed/overall.json -->
  </section>

  <section id="by-location">
    <h2>Median resolution time by neighborhood</h2>
    <p class="map-intro">
      Darker means slower. Hover or tap a neighborhood for details. Neighborhoods
      are shaded in five equal-sized groups (quintiles) of the 87 medians.
    </p>
    <div id="map" role="img" aria-label="Map of Minneapolis neighborhoods shaded by median 311 resolution time"></div>
    <div id="map-legend"></div>
    <p id="map-notes" class="map-notes">
      <!-- Filled in by app.js from data/processed/by_neighborhood.json -->
    </p>
  </section>

  <script src="app.js"></script>
</body>
</html>
